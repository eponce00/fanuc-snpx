[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanuc-snpx"
version = "0.1.0.dev0"
description = "Pure-Python, read-only-by-default SNPX (GE SRTP) client for FANUC robot controllers with the HMI Device (SNPX) option."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "fanuc-snpx contributors" }]
keywords = ["fanuc", "snpx", "srtp", "robot", "hmi", "industrial"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# Runtime: standard library only. Do not add dependencies here.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
fanuc-snpx = "fanuc_snpx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fanuc_snpx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: talks to a real controller; skipped unless FANUC_SNPX_HARDWARE=1 (read-only)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "BLE", "A", "C4", "PT"]
ignore = [
    "PLR2004", # magic numbers are protocol constants here; they are named where it matters
    "PLR0913", # explicit keyword arguments are clearer than option objects for this API
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR0913", "PLR0917", "PLC0415"]
"src/fanuc_snpx/testing.py" = ["S104"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/fanuc_snpx"]
