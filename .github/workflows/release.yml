name: release

# Push a tag like v0.1.0 to build the sdist and wheel, run the tests against the
# wheel, and attach both files to a GitHub release. Nothing is uploaded to PyPI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: python -m pip install build pytest hypothesis
      - run: python -m build
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pytest -q
      - name: Refuse to ship reference material
        run: |
          ! tar -tzf dist/*.tar.gz | grep -q vendor-docs
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
