<head>

</head>
<body>
<script language=javascript>
<!--

  var m=today.getMinutes();
  var s=today.getSeconds();
  // Add the time to the end of the URL to prevent browser cache.
  document.location.href = "/td/rosipcfg.xml?time="+h+":"+m+":"+s;
//-->
</script>
</body>
</html>
